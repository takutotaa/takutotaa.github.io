/* Mobile-first layout: prevent intrinsic control widths from overflowing grid/flex items. */

/* Liquid Glass refinement: visual treatment only; responsive geometry stays intact. */

.glass{position:relative;isolation:isolate}
.glass::before{content:"";position:absolute;inset:1px;border-radius:inherit;border:1px solid rgba(255,255,255,.34);pointer-events:none;z-index:-1}

.seg button:active{transform:scale(.98)}

.tabs button{border-radius:13px;transition:background-color .2s ease,transform .18s ease,color .2s ease}
.tabs button.active{background:rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 8px rgba(35,45,65,.045)}
.tabs button:active{transform:scale(.94)}
.fab{background:#343c4c;border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),0 10px 26px rgba(35,42,55,.2);transition:transform .18s ease,box-shadow .18s ease}

.btn.secondary{background:rgba(232,236,241,.86);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.sortable-row.sort-active{background:rgba(226,232,240,.86);box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}
