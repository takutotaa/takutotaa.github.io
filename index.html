<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf2fa"><title>家計簿</title><link rel="manifest" href="manifest.webmanifest"><style>

xt-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:-23px}.chart-wrap{padding-bottom:32px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #e5eaf1}.line:last-child{border-bottom:0}.line small{color:#8791a4}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:9px}.amount{font-weight:750;white-space:nowrap}.empty{text-align:center;padding:34px 12px;color:#8a96a9;font-size:13px;line-height:1.9}.fab{position:fixed;bottom:calc(94px + env(safe-area-inset-bottom));right:max(20px,calc((100vw - 540px)/2 + 20px));height:60px;width:60px;border-radius:20px;background:#343c4c;color:#fff;font-size:34px;border:0;box-shadow:0 8px 22px rgba(35,42,55,.20)}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,540px);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.78);backdrop-filter:blur(28px);border:1px solid #fff;border-radius:24px 24px 0 0;padding:10px 8px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -5px 30px #596a8a16}.tabs button{border:0;background:transparent;color:#8794a9;font-size:11px;font-weight:700;padding:5px}.tabs button.active{color:#343c4c}.tabs span{display:block;font-size:22px;margin-bottom:3px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;color:#66758e;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #dfe6f1;border-radius:13px;background:#ffffffcf;color:#27334b;padding:12px 13px;outline:none}input:focus,select:focus,textarea:focus{border-color:#6b90e5;box-shadow:0 0 0 3px #7e9ff129}textarea{resize:vertical;min-height:68px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;background:#343c4c;color:white;border-radius:14px;padding:13px 16px;font-weight:750}.btn.secondary{background:#eceef1;color:#414a5a}.btn.danger{background:#ffedf0;color:#c2465e}.btn.small{font-size:12px;padding:8px 11px;border-radius:11px}.btn.full{width:100%}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.actions .btn{flex:1}.modal-back{position:fixed;inset:0;background:#1d2d4e65;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal-back.show{display:flex}.sheet{background:#f8f9fb;width:min(100%,540px);border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:0 -12px 60px #23395a33}.sheet h2{margin:0 0 12px;font-size:20px}.setting-item{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #e5eaf2}.setting-item:last-child{border:0}.setting-item button{margin-left:5px}.pill{font-size:11px;border-radius:20px;padding:4px 8px;background:#e9effa;color:#5e76a6}.muted{color:#8995a8}.notice{font-size:12px;color:#78859b;line-height:1.6}.hide{display:none!important}.drag{cursor:grab;color:#99a5b6;padding-right:10px}.card-head{display:flex;align-items:center;gap:10px}.card-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:white;font-size:22px}.credit-num{font-size:23px;font-weight:800;margin:5px 0 12px}.divider{height:1px;background:#e5eaf2;margin:13px 0}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#293b5b;color:white;padding:12px 18px;border-radius:14px;font-size:13px;z-index:30;display:none;max-width:90vw}.toast.show{display:block}@media(max-width:360px){.app{padding-left:12px;padding-right:12px}.glass{padding:15px}.bar-amount{font-size:9px}}
 .credit-payment-row{padding:13px 0 4px}.credit-payment-row+.credit-payment-row{border-top:1px solid #e7e9ed;margin-top:4px}.credit-payment-row .credit-num{margin:8px 0 12px} @media(prefers-reduced-transparency:reduce){.glass,.tabs,.sync{backdrop-filter:none;-webkit-backdrop-filter:none;background:#fff}}
</style></head><body><div class="toast" id="toast"></div><div class="app"><header class="top"><div><div class="brand">家計簿<span style="color:#343c4c">.</span></div><div class="sub" id="month-caption"></div></div><button class="sync" id="sync-status" onclick="syncAll()">◌ 接続確認中</button></header>
<main><section class="page active" id="page-home"><div class="glass"><div class="eyebrow">今月の支出合計</div><div class="hero" id="home-total">¥0</div><div class="seg"><button id="seg-graph" class="active" onclick="setHomeMode('graph')">グラフ</button><button id="seg-credit" onclick="setHomeMode('credit')">クレジット</button></div><div id="home-graph"><div class="chart-wrap"><div class="bar-chart" id="bar-chart"></div></div><div class="eyebrow" style="margin-top:15px">カテゴリ別内訳</div><div id="home-breakdown"></div></div><div id="home-credit" class="hide"></div></div></section>
<section class="page" id="page-summary"><div class="section-title">月別集計</div><div class="glass"><div class="field"><label>集計月</label><input type="month" id="summary-month" onchange="renderSummary()"></div><div id="summary-results"></div></div></section>
<section class="page" id="page-edit"><div class="section-title">支出を編集</div><div class="glass"><div class="grid2"><div class="field"><label>対象月</label><input type="month" id="edit-month" onchange="renderEdit()"></div><div class="field"><label>カテゴリ</label><select id="filter-category" onchange="renderEdit()"></select></div></div><div class="field"><label>支払方法</label><select id="filter-payment" onchange="renderEdit()"></select></div><label class="notice"><input type="checkbox" id="show-deleted" onchange="renderEdit()" style="width:auto"> 削除済みの支出も表示</label><div id="edit-results"></div></div></section>
<section class="page" id="page-settings"><div class="section-title">設定</div><div class="glass"><div class="setting-item"><div><b>カテゴリ管理</b><div class="sub">追加・編集・並び替え</div></div><button class="btn small secondary" onclick="openManager('categories')">管理</button></div><div class="setting-item"><div><b>支払方法管理</b><div class="sub">メイン設定・並び替え</div></div><button class="btn small secondary" onclick="openManager('payment_methods')">管理</button></div><div class="setting-item"><div><b>クレジットカード管理</b><div class="sub">締め日・支払日・色・アイコン</div></div><button class="btn small secondary" onclick="openManager('credit_cards')">管理</button></div><div class="setting-item"><div><b>繰り返し支出</b><div class="sub">毎週・毎月・毎年</div></div><button class="btn small secondary" onclick="openManager('recurring_expenses')">管理</button></div></div><div class="glass"><b>データ同期</b><p class="notice">オフラインでも登録できます。接続復帰後に同期します。</p><div id="sync-detail" class="notice"></div><button class="btn secondary full" onclick="syncAll()">今すぐ同期</button></div></section></main></div>
<button class="fab" id="fab" aria-label="支出を追加" onclick="openExpense()">＋</button><nav class="tabs"><button class="active" data-page="home" onclick="showPage('home')"><span>⌂</span>ホーム</button><button data-page="summary" onclick="showPage('summary')"><span>▥</span>集計</button><button data-page="edit" onclick="showPage('edit')"><span>✎</span>編集</button><button data-page="settings" onclick="showPage('settings')"><span>⚙</span>設定</button></nav>
<div class="modal-back" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 id="modal-title"></h2><div id="modal-body"></div><div id="modal-actions" class="actions"></div></div></div>
<script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script><script src="config.js"></script><script src="app.js"></script></body></html>
